[package]
name = "jgenesis-proc-macros"
version = "0.15.0"
edition = "2024"
license = "GPL-3.0-only"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
bincode = { version = "2", features = ["derive"] }
jgenesis-common = { path = "../jgenesis-common" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
test-log = "0.2"
toml = "1"
