[package]
name = "jgenesis-common"
version = "0.15.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = []
clap = ["dep:clap"]
serde = ["dep:serde"]

[dependencies]
jgenesis-proc-macros = { path = "../jgenesis-proc-macros" }

bincode = { version = "2", features = ["derive"] }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
clap = { version = "4", optional = true }
log = "0.4"
multiversion = "0.9"
rand = "0.10"
rustc-hash = "2"
serde = { version = "1", optional = true }
time = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
